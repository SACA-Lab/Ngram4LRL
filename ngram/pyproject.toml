[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.backends.legacy:BuildBackend"

[project]
name = "ngram-research"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = [
    "datasets>=2.18",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pandas>=2.0",
    "numpy>=1.26",
    "modal>=0.64",
    "pyyaml>=6.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["ngram*"]
